<x-dc>
<helmet>

<style>
body{margin:0;background:#1b2340}
a{color:#ffc83d}a:hover{color:#fff4e6}
</style>
</helmet>
<div style="min-height: 100vh; background: #1b2340; color: #fff4e6; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 16px; line-height: 24px; display: flex; flex-direction: column">
  <header style="max-width: 1240px; width: 100%; margin: 0 auto; padding: 20px 32px; box-sizing: border-box; display: flex; align-items: center">
    <a href="Library.dc.html" style="font-family: Nunito, ui-rounded, system-ui, sans-serif; font-weight: 800; font-size: 28px; line-height: 32px; color: #fff4e6; text-decoration: none">instik</a>
  </header>
  <main style="flex-grow: 1; max-width: 680px; margin: 0 auto; padding: 48px 32px 80px; display: flex; flex-direction: column; align-items: center; gap: 32px; text-align: center">
    <svg width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Today's goal reached">
      <circle cx="60" cy="60" r="50" fill="none" stroke="#fff4e633" stroke-width="10"></circle>
      <circle cx="60" cy="60" r="50" fill="none" stroke="#ff6a4d" stroke-width="10" stroke-linecap="round"></circle>
      <path d="M42 61l12 12 24-26" fill="none" stroke="#fff4e6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    <div style="display: flex; flex-direction: column; gap: 12px">
      <h1 style="margin: 0; font-family: Nunito, ui-rounded, system-ui, sans-serif; font-size: 48px; line-height: 54px; font-weight: 800">That's enough for today.</h1>
      <p style="margin: 0; font-size: 22px; line-height: 32px">See you tomorrow.</p>
    </div>
    <div style="width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
      <div style="padding: 20px; border-radius: 24px; background: #fff4e614; display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: Nunito, ui-rounded, system-ui, sans-serif; font-size: 32px; line-height: 38px; font-weight: 800">24 min</span>
        <span style="font-size: 14px">watched today</span>
      </div>
      <div style="padding: 20px; border-radius: 24px; background: #fff4e614; display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: Nunito, ui-rounded, system-ui, sans-serif; font-size: 32px; line-height: 38px; font-weight: 800">3</span>
        <span style="font-size: 14px">videos</span>
      </div>
      <div style="padding: 20px; border-radius: 24px; background: #fff4e614; display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: Nunito, ui-rounded, system-ui, sans-serif; font-size: 32px; line-height: 38px; font-weight: 800">13h 04m</span>
        <span style="font-size: 14px">of Egyptian Arabic</span>
      </div>
    </div>
    <div style="width: 100%; display: flex; flex-direction: column; gap: 12px; align-items: center">
      <span style="font-size: 14px; font-weight: 600">This week</span>
      <ul aria-label="Days you watched this week" style="list-style: none; margin: 0; padding: 0; display: flex; gap: 10px">
        <li style="display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px"><span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 999px; background: #19a38f"></span>Mon</li>
        <li style="display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px"><span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 999px; background: #19a38f"></span>Tue</li>
        <li style="display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px"><span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 999px; border: 2px solid #fff4e64d; box-sizing: border-box"></span>Wed</li>
        <li style="display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px"><span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 999px; background: #19a38f"></span>Thu</li>
        <li style="display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px"><span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 999px; background: #ff6a4d"></span>Today</li>
        <li style="display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: #fff4e6b3"><span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 999px; border: 2px dashed #fff4e64d; box-sizing: border-box"></span>Sat</li>
        <li style="display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: #fff4e6b3"><span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 999px; border: 2px dashed #fff4e64d; box-sizing: border-box"></span>Sun</li>
      </ul>
      <span style="font-size: 13px; color: #fff4e6cc">Missed a day? That's fine. Nothing is lost.</span>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; align-items: center">
      <a href="Progress.dc.html" style="display: inline-flex; align-items: center; height: 52px; padding: 0 26px; border-radius: 14px; background: #ff6a4d; color: #1b2340; text-decoration: none; font-size: 16px; font-weight: 600">See your roadmap</a>
      <a href="Library.dc.html" style="font-size: 15px; font-weight: 600">I have a bit more time</a>
    </div>
  </main>
</div>
</x-dc>

</html>
